name: Build project images

on:
  push:
    branches:
      - main
    paths:
      - todo/Dockerfile
      - todo/index.js
      - todo/package.json
      - todo/package-lock.json
      - todo-backend/Dockerfile
      - todo-backend/index.js
      - todo-backend/package.json
      - todo-backend/package-lock.json

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo

jobs:
  build-and-update-manifests:
    name: Build images and update Git manifests
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build and push Todo images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          backend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$IMAGE_TAG"
          frontend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo:$IMAGE_TAG"

          docker build --platform linux/amd64 -t "$backend_image" ./todo-backend
          docker push "$backend_image"

          docker build --platform linux/amd64 -t "$frontend_image" ./todo
          docker push "$frontend_image"

      - name: Install Kustomize
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update image tags in Git
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          backend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$IMAGE_TAG"
          frontend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo:$IMAGE_TAG"

          cd todo-backend/manifests
          kustomize edit set image "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend=$backend_image"
          cd ../../todo/manifests
          kustomize edit set image "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo=$frontend_image"
          cd ../..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo-backend/manifests/kustomization.yaml todo/manifests/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update project images to $IMAGE_TAG"
            git push origin HEAD:main
          fi
