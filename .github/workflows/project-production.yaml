name: Deploy project to production

on:
  push:
    tags:
      - "**"

permissions:
  contents: write
  id-token: write

concurrency:
  group: project-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo

jobs:
  build-and-promote:
    name: Build tagged images and promote production
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build and push tagged images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          backend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$IMAGE_TAG"
          frontend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo:$IMAGE_TAG"
          broadcaster_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$IMAGE_TAG"

          docker build --platform linux/amd64 -t "$backend_image" ./todo-backend
          docker push "$backend_image"

          docker build --platform linux/amd64 -t "$frontend_image" ./todo
          docker push "$frontend_image"

          docker build --platform linux/amd64 -t "$broadcaster_image" ./broadcaster
          docker push "$broadcaster_image"

      - name: Install Kustomize
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Promote tagged images on production branch
        env:
          IMAGE_TAG: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin production >/dev/null 2>&1; then
            git fetch origin production
            git checkout -B production origin/production
            git merge --ff-only "$GITHUB_SHA"
          else
            git checkout -b production "$GITHUB_SHA"
          fi

          backend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$IMAGE_TAG"
          frontend_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo:$IMAGE_TAG"
          broadcaster_image="$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$IMAGE_TAG"

          cd environments/production
          kustomize edit set image "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo=$frontend_image"
          kustomize edit set image "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend=$backend_image"
          kustomize edit set image "$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster=$broadcaster_image"
          cd ../..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/production/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Promote project release $RELEASE_TAG to production"
            git push origin production
          fi