apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: project
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/broadcaster:latest
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: broadcaster-webhook
                  key: WEBHOOK_URL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
