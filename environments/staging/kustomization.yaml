apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../todo/manifests
  - ../../todo-backend/manifests
  - ../../broadcaster/manifests
  - ../nats.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: broadcaster
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: broadcaster
      spec:
        template:
          spec:
            containers:
              - name: broadcaster
                env:
                  - name: LOG_ONLY
                    value: "true"
                  - name: WEBHOOK_URL
                    $patch: delete

images:
  - name: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/todo
    newTag: done-v1
  - name: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/todo-backend
    newTag: nats-v1
  - name: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/broadcaster
    newTag: latest