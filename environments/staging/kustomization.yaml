apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- ../../todo/manifests
- ../../todo-backend/manifests
- ../../broadcaster/manifests
- ../nats.yaml

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: broadcaster
    spec:
      template:
        spec:
          containers:
            - name: broadcaster
              env:
                - name: LOG_ONLY
                  value: "true"
                - name: WEBHOOK_URL
                  $patch: delete
  target:
    group: apps
    kind: Deployment
    name: broadcaster
    version: v1

images:
- name: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/broadcaster
  newName: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/broadcaster
  newTag: 29a4589092fb81778395c9e2f8ab2c899069e2d4
- name: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/todo
  newName: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/todo
  newTag: 29a4589092fb81778395c9e2f8ab2c899069e2d4
- name: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/todo-backend
  newName: europe-north1-docker.pkg.dev/devopswithkubernetes-509407/dwk-repo/todo-backend
  newTag: 29a4589092fb81778395c9e2f8ab2c899069e2d4
