apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-pvc
      containers:
        - name: ping-pong
          image: ping-pong:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
          env:
            - name: PORT
              value: "3000"